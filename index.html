<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="google-site-verification" content="3FirHzdYjexcDK_4TbZJgNRnEQfQaFb63xUoTGyMdJU" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="512x512" href="/logo.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover" />
    
    <!-- Security Headers (Pre-Launch Checklist) -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://*.supabase.in; img-src 'self' data: blob: https://*.githubusercontent.com https://*.googleusercontent.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://api.fontshare.com; font-src 'self' https://fonts.gstatic.com https://api.fontshare.com https://*.fontshare.com; script-src 'self' 'unsafe-inline' 'unsafe-eval';" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    
    <meta name="description" content="HabitFlow — Local-first habit tracker and to-do list. Build lasting habits with rich analytics and no account required." />
    <meta name="theme-color" content="#10b981" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <title>HabitFlow — Build Lasting Habits</title>
    <script>
      window.onerror = function(msg, url, lineNo, columnNo, error) {
        fetch('http://localhost:3333', { method: 'POST', body: JSON.stringify({ type: 'error', msg: msg, stack: error ? error.stack : '' }) }).catch(e=>null);
        return false;
      };
      const origError = console.error;
      console.error = function(...args) {
        fetch('http://localhost:3333', { method: 'POST', body: JSON.stringify({ type: 'console.error', args: args.map(a => typeof a === 'object' ? JSON.stringify(a) : a) }) }).catch(e=>null);
        origError.apply(console, args);
      };
    </script>
  </head>
  <body class="bg-surface-dim text-on-surface font-body-md selection:bg-primary-container selection:text-on-primary-container min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
